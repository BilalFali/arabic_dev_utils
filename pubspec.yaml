name: arabic_dev_utils
description: "Utilities for developers building Arabic and RTL Flutter/Dart applications: text normalization, invisible-character cleanup, Arabic-aware search, digit conversion, RTL direction helpers, and Hijri/Gregorian calendar conversion."
version: 0.2.0
repository: https://github.com/BilalFali/arabic_dev_utils

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
